version: '3.8'

services:
  # Only the recommendation service in container
  recommendation-service:
    build: .
    container_name: recommendation_service
    environment:
      # External backend API running on host (without /api/v1 prefix)
      BACKEND_API_URL: http://host.docker.internal:8000
      
      # LLM Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: gemini-2.0-flash
      
      # Disable database (use API only)
      USE_DATABASE: "false"
      
      # Service settings
      DEBUG: "true"
    ports:
      - "8001:8000"  # Map to different port to avoid conflict with host API
    networks:
      - rec_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  rec_network:
    driver: bridge