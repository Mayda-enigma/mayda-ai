[project]
name = "enigma-hack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.2",
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "langchain-huggingface>=1.2.2",
    "langdetect>=1.0.9",
    "numpy>=2.4.6",
    "openai-whisper>=20250625",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sentence-transformers>=5.5.1",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "data", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# E501: line length is enforced via formatter, not lint.
# B008: FastAPI's `Depends(...)` and `Header(...)` are idiomatic call-in-default.
# B904: `raise` without `from` is acceptable in FastAPI handlers that re-raise as HTTPException.
ignore = ["E501", "B008", "B904"]

