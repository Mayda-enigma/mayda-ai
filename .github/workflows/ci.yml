name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detect which areas of the repo changed so downstream jobs can skip cleanly
  # on docs-only commits. The original plan (AI-003) had one path per service;
  # the codebase has since collapsed into a single `src/` app so we filter on
  # that path. Per-service filters (recommendation/, search/, ...) are listed
  # for forward compatibility if the layout splits again.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
            docs:
              - 'docs/**'
              - '**/*.md'

  build:
    name: Build & smoke-test (${{ matrix.service }})
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The matrix has a single entry today (consolidated app). Keep the
        # structure so AI-001-rev or future re-splits can extend it back to
        # [recommendation, search, inventory, voice] without rewriting CI.
        service: [app]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Smoke-test app import
        run: uv run python -c "from src.main import app; assert len(app.routes) > 0"

      - name: Run pytest (if tests exist)
        run: |
          if [ -d tests ] || ls test_*.py 2>/dev/null || ls **/test_*.py 2>/dev/null; then
            uv run pytest -q
          else
            echo "No tests directory yet — skipping"
          fi
